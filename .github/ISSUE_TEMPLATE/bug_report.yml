name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can — it helps a lot.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I upload a Westpac CSV, the date column shows 01/01/1970 for all rows."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to Upload CSV
        2. Select a Westpac bank statement
        3. Click Upload
        4. Open Transactions page — dates are wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: bank
    attributes:
      label: Which bank is involved? (if applicable)
      options:
        - Not applicable
        - Westpac
        - NAB
        - Macquarie
        - Superhero
        - Other (describe in additional context)
    validations:
      required: false

  - type: dropdown
    id: db
    attributes:
      label: Database mode
      options:
        - SQLite
        - Docker + MariaDB
        - External MariaDB
        - Not sure
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 / Windows 11 / Ubuntu 24.04"
    validations:
      required: false

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste any error output here. Run `./run.sh logs backend` to see backend logs.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, CSV format details, anything else that might help.
    validations:
      required: false
