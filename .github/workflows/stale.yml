name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 8am UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days
            unless there is new activity or a comment indicating it is still relevant.
            If you're still interested in this, please leave a comment.
          close-issue-message: >
            Closing due to inactivity. Feel free to re-open if this is still relevant
            or if you have new information to add.

          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: >
            This PR has had no activity for 30 days. It will be closed in 14 days
            unless there is new activity. If you're still working on this, please
            leave a comment or push a new commit.
          close-pr-message: >
            Closing due to inactivity. The branch can be restored if you'd like to
            continue working on it.

          # Never mark these as stale
          exempt-issue-labels: "pinned,security,help wanted,good first issue"
          exempt-pr-labels: "pinned,security"
          exempt-all-milestones: true
