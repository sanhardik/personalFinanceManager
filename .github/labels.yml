# GitHub Labels — applied via github-label-sync or manually
# Colours use hex without the leading #

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "feature"
  color: "a2eeef"
  description: "New feature or enhancement request"

- name: "docs"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "good first issue"
  color: "7057ff"
  description: "Great for newcomers to the codebase"

- name: "help wanted"
  color: "008672"
  description: "Extra attention or contributors needed"

- name: "needs-triage"
  color: "e4e669"
  description: "Needs maintainer review and labelling"

- name: "needs-tests"
  color: "fbca04"
  description: "Change requires additional test coverage"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "stale"
  color: "ededed"
  description: "No recent activity — will be closed soon"

