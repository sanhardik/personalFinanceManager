version: '3.8'
services:
  finance-db:
    container_name: finance-db
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: financepass
      MYSQL_DATABASE: finance_app
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: finance_pass
    restart: unless-stopped
    volumes:
      - finance_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  finance-phpmyadmin:
    container_name: finance-phpmyadmin
    # Official image is amd64-only; on Apple Silicon Docker runs it via emulation.
    image: phpmyadmin/phpmyadmin:5.2.3
    platform: linux/amd64
    links:
      - finance-db:db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: finance-db
      PMA_PORT: 3306
    depends_on:
      finance-db:
        condition: service_healthy

volumes:
  finance_data:
